<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="entry-screen">
      <div id="entry-symbol"></div>
    </div>

    <div id="main-content">
      <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="name-filter" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence
              id="name-turb"
              type="turbulence"
              baseFrequency="0.008 1.1"
              numOctaves="1"
              seed="1"
              result="noise"
            />
            <feDisplacementMap
              id="name-disp"
              in="SourceGraphic"
              in2="noise"
              scale="6"
              xChannelSelector="R"
              yChannelSelector="G"
            />
          </filter>
        </defs>
      </svg>

      <video id="bg-video" muted loop playsinline>
        <source id="bg-video-source" src="" type="video/mp4" />
      </video>

      <canvas id="bg-canvas"></canvas>

      <div class="volume-control" aria-label="Volume control">
        <span class="volume-icon" aria-hidden="true">🔊</span>
        <input
          id="volume-slider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.5"
          aria-label="Volume"
        />
      </div>

      <div id="profile-card">
        <div id="profile-main">
          <div id="avatar-wrapper">
            <img id="avatar" src="" alt="avatar" />
            <img id="avatar-decoration" src="" alt="" />
          </div>
          <div id="profile-info">
            <div id="profile-name">
              <div id="name-row">
                <div class="name-wrapper">
                  <span id="name-text"></span>
                  <span class="name-tooltip" id="name-tooltip"></span>
                </div>
                <div id="badges"></div>
              </div>
            </div>
            <p id="profile-status"></p>
          </div>
        </div>

        <div id="discord-presence">
          <div id="discord-avatar-wrapper">
            <img id="discord-avatar" src="" alt="discord avatar" />
            <img id="discord-status-icon" src="" alt="" />
          </div>
          <div id="discord-info">
            <span id="discord-username"></span>
            <span id="discord-activity"></span>
          </div>
        </div>

        <div id="social-links"></div>
      </div>
    </div>

    <canvas id="cursor-canvas"></canvas>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
